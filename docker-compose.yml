services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agenda_sime_app
    restart: always
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    networks:
      - lms_network

networks:
  lms_network:
    external: true
    name: lms-amg_lms_network
